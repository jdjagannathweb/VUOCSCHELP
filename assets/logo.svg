<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <linearGradient id="vuoBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="vuoOrangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="vuoCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Logo Icon Badge -->
  <g transform="translate(10, 10)">
    <!-- Outer Shield / Hexagon -->
    <path d="M50 0 L92 24 L92 76 L50 100 L8 76 L8 24 Z" fill="url(#vuoBlueGrad)" stroke="#38bdf8" stroke-width="2.5" />
    
    <!-- Inner Accent Ring -->
    <circle cx="50" cy="50" r="34" fill="none" stroke="url(#vuoOrangeGrad)" stroke-width="2.5" stroke-dasharray="4 2" />
    
    <!-- Digital CSC Network Nodes -->
    <circle cx="50" cy="26" r="4.5" fill="#38bdf8" />
    <circle cx="29" cy="62" r="4.5" fill="#38bdf8" />
    <circle cx="71" cy="62" r="4.5" fill="#38bdf8" />
    <line x1="50" y1="26" x2="29" y2="62" stroke="#38bdf8" stroke-width="2" opacity="0.7"/>
    <line x1="50" y1="26" x2="71" y2="62" stroke="#38bdf8" stroke-width="2" opacity="0.7"/>
    <line x1="29" y1="62" x2="71" y2="62" stroke="#38bdf8" stroke-width="2" opacity="0.7"/>

    <!-- Central Tech Ashoka / Odisha Emblem VLE Symbol -->
    <circle cx="50" cy="50" r="14" fill="#ffffff" />
    <circle cx="50" cy="50" r="10" fill="#0369a1" />
    <!-- V Letter stylized -->
    <path d="M44 45 L50 56 L56 45" fill="none" stroke="#fb923c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Top Crown Ribbon -->
    <path d="M38 12 L50 4 L62 12" fill="none" stroke="#fb923c" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Typography: VUO CSC HELP -->
  <g transform="translate(125, 20)">
    <!-- Main Title -->
    <text x="0" y="42" font-family="'Segoe UI', 'Inter', -apple-system, sans-serif" font-weight="900" font-size="38" letter-spacing="1">
      <tspan fill="#0284c7">VUO</tspan>
      <tspan fill="#0f172a"> </tspan>
      <tspan fill="#ea580c">CSC</tspan>
      <tspan fill="#0f172a"> HELP</tspan>
    </text>

    <!-- Subtitle Badge / Organization Name -->
    <rect x="0" y="54" width="220" height="20" rx="4" fill="#0369a1" />
    <text x="8" y="68" font-family="'Segoe UI', 'Inter', sans-serif" font-weight="700" font-size="11" fill="#ffffff" letter-spacing="1">
      VUO CSC HELP
    </text>
    
    <!-- Tagline in English & Odia hint -->
    <text x="230" y="68" font-family="'Segoe UI', 'Inter', sans-serif" font-weight="600" font-size="11" fill="#64748b">
      Digital Partner for CSC Services
    </text>
    
    <text x="0" y="90" font-family="'Noto Sans Odia', 'Segoe UI', sans-serif" font-weight="600" font-size="11.5" fill="#0284c7">
      ସମସ୍ତ CSC ସେବା ଓ ଡିଜିଟାଲ୍ ଟୁଲ୍ — ଗୋଟିଏ ପ୍ଲାଟଫର୍ମରେ
    </text>
  </g>
</svg>
